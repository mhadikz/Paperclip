# Mirror of azure-pipelines.yml for GitHub-hosted mirrors.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    # macOS 15 (Xcode 16 SDK) proves the pre-Liquid-Glass fallback compiles;
    # macOS 26 (Xcode 26 SDK) compiles the glass path that releases ship with.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Type-check
        run: ./scripts/check.sh
      - name: Tests
        run: ./scripts/test.sh
      - name: Build (universal, ad-hoc)
        run: ./scripts/build.sh --release --no-install
      - name: Package
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Paperclip-${{ matrix.os }}
          path: build/dist
